[project]
name = "aihub_back"
version = "0.1.0"
description = "This is a AI Application Made with Python"
readme = "README.md"
authors = [
    { name = "sayan", email = "sayansinha728@gmail.com" }
]
requires-python = ">=3.12.14"
dependencies = [
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.3.17",
    "langchain-core>=1.6.0",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "pydantic>=2.13.4",
    "pypdf>=6.16.2",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

[project.scripts]
app = "aihub_back:main"


[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu132"

[dependency-groups]
dev = [
    "fastapi[standard]>=0.141.1",
    "ipykernel>=7.3.0",
    "ruff>=0.16.4",
]
